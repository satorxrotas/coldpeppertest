<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="robots" content="noindex, nofollow" />
  <title>🥶🌶  Cold Peppers Collective 🥶🌶</title>
  <link rel="icon" type="image/png" href="../logo_favicon_01.png" />
  <style>
    :root {
      --bg: #0a0a0a;
      --ink: #ffffff;
      --dim: rgba(255, 255, 255, 0.45);
      --cold: #8fdcff;
      --pepper: #ff4a3d;
      --chrome: linear-gradient(180deg, #eef1f3 0%, #a4adb4 42%, #5a6269 56%, #cfd6db 100%);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html { height: 100%; height: -webkit-fill-available; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      width: 100vw;
      height: 100vh;
      height: -webkit-fill-available;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; touch-action: manipulation; }

    /* ───────── Backdrop ───────── */
    #backdrop {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
      background:
        radial-gradient(ellipse 55% 50% at 50% 58%, rgba(143, 220, 255, 0.16), transparent 70%),
        radial-gradient(ellipse 80% 60% at 50% 120%, rgba(255, 74, 61, 0.14), transparent 70%),
        var(--bg);
    }
    .panel {
      position: absolute; top: 14%; bottom: 10%; width: 22vw;
      opacity: 0.5;
    }
    .panel.left  { left: -2vw;  background: linear-gradient(160deg, rgba(143,220,255,.20), rgba(143,220,255,0) 70%); clip-path: polygon(0 0, 100% 12%, 78% 100%, 0 100%); }
    .panel.right { right: -2vw; background: linear-gradient(200deg, rgba(255,74,61,.20), rgba(255,74,61,0) 70%);   clip-path: polygon(0 12%, 100% 0, 100% 100%, 22% 100%); }

    #ghost {
      position: fixed; z-index: 1; left: 50%; top: 48%;
      transform: translate(-50%, -50%);
      font-size: clamp(72px, 22vw, 320px);
      font-weight: 900; font-style: italic; letter-spacing: -0.02em;
      text-transform: uppercase; white-space: nowrap;
      color: transparent; -webkit-text-stroke: 1px rgba(255, 255, 255, 0.07);
      pointer-events: none;
    }

    #canvas-container { position: fixed; inset: 0; z-index: 2; }
    #canvas-container canvas { display: block; width: 100% !important; height: 100% !important; }

    /* ───────── HUD ───────── */
    #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
    body.ready #hud { opacity: 1; }
    #hud button, #hud .interactive { pointer-events: auto; }

    #logo {
      position: absolute; top: calc(22px + var(--safe-top)); left: 24px;
    }
    #logo img { width: 130px; height: auto; display: block; filter: invert(1); }

    #top {
      position: absolute; top: calc(18px + var(--safe-top)); left: 50%; transform: translateX(-50%);
      width: min(640px, 92vw);
      display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    }

    .title-bar {
      height: 34px;
      background: var(--chrome);
      clip-path: polygon(0 0, 100% 0, calc(100% - 22px) 100%, 22px 100%);
      display: flex; align-items: center; justify-content: center;
      color: #111; font-weight: 900; font-style: italic;
      letter-spacing: 0.22em; font-size: 13px; text-transform: uppercase;
    }

    .banner {
      height: 64px;
      border: 3px solid transparent;
      background: linear-gradient(#0d0f10, #0d0f10) padding-box, var(--chrome) border-box;
      clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 16px 100%, 0 50%);
      display: grid; grid-template-columns: 64px 1fr 64px; align-items: center;
      position: relative;
    }
    .banner .arrow {
      height: 100%; display: flex; align-items: center; justify-content: center;
      color: #cfd6db; transition: color 0.15s, transform 0.15s;
    }
    .banner .arrow:hover { color: var(--cold); }
    .banner .arrow:active { transform: scale(0.9); }
    .banner .arrow svg { width: 26px; height: 26px; }
    .banner .center { text-align: center; line-height: 1; overflow: hidden; }
    .cat-label {
      display: block; font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--dim); margin-bottom: 5px;
    }
    #item-name {
      display: block; font-size: clamp(22px, 5vw, 30px); font-weight: 900; font-style: italic;
      text-transform: uppercase; letter-spacing: 0.04em;
      background: linear-gradient(180deg, #fff6a8, #ffc21a 55%, #ff8a00);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      white-space: nowrap;
    }
    #item-name.pop { animation: pop 0.32s cubic-bezier(.2, 1.4, .4, 1); }
    @keyframes pop { from { transform: translateY(8px) scale(0.92); opacity: 0; } to { transform: none; opacity: 1; } }
    .banner.disabled .arrow { opacity: 0.2; pointer-events: none; }

    /* Category rail */
    #rail {
      position: absolute; left: 24px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px; width: 190px;
    }
    .slot {
      text-align: left; padding: 11px 14px 11px 16px;
      background: rgba(255, 255, 255, 0.04);
      border-left: 3px solid rgba(255, 255, 255, 0.15);
      clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .slot:hover { background: rgba(255, 255, 255, 0.08); }
    .slot.active {
      background: rgba(143, 220, 255, 0.12);
      border-left-color: var(--cold);
      transform: translateX(6px);
    }
    .slot.empty { opacity: 0.35; pointer-events: none !important; }
    .slot .s-cat { display: block; font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim); }
    .slot .s-name { display: block; margin-top: 4px; font-size: 14px; font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: 0.04em; }

    /* Bottom-left info */
    #info {
      position: absolute; left: 24px; bottom: calc(26px + var(--safe-bottom));
      width: 230px;
    }
    #info .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
    #info .row b { color: var(--ink); font-weight: 800; }
    #segments { display: flex; gap: 4px; }
    #segments i {
      flex: 1; height: 8px; max-width: 28px;
      background: rgba(255, 255, 255, 0.12);
      transform: skewX(-24deg);
      transition: background 0.2s;
    }
    #segments i.on { background: linear-gradient(90deg, var(--cold), #fff); }

    /* Bottom-right actions */
    #actions {
      position: absolute; right: 24px; bottom: calc(26px + var(--safe-bottom));
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    }
    #actions button {
      display: flex; align-items: center; gap: 10px;
      font-size: 12px; font-weight: 800; font-style: italic;
      letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.8);
      padding: 6px 0; transition: color 0.15s, transform 0.15s;
    }
    #actions button:hover { color: var(--cold); }
    #actions button:active { transform: scale(0.95); }
    #actions .dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid currentColor; position: relative;
    }
    #actions .dot::after { content: ''; position: absolute; inset: 2px; border-radius: 50%; background: currentColor; opacity: 0.6; }

    #hint {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: calc(26px + var(--safe-bottom));
      font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255,255,255,0.4);
      white-space: nowrap; text-shadow: 0 0 8px #000;
    }

    /* ───────── Loading ───────── */
    #loading {
      position: fixed; inset: 0; z-index: 20; display: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      pointer-events: none; transition: opacity 0.4s;
    }
    body.unlocked:not(.ready) #loading { display: flex; }
    #loading span { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim); }
    #loading .bar { width: 160px; height: 3px; background: rgba(255,255,255,0.12); overflow: hidden; }
    #loading .bar i { display: block; height: 100%; width: 0; background: #fff; transition: width 0.2s; }

    /* ───────── Password gate ───────── */
    #gate {
      position: fixed; inset: 0; z-index: 100; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      padding: 24px; transition: opacity 0.5s;
    }
    body.unlocked #gate { opacity: 0; pointer-events: none; }
    #gate img { width: 240px; max-width: 70vw; height: auto; filter: invert(1); }
    #gate form { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
    #gate input {
      width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px; padding: 12px 14px; color: #fff; font-family: var(--font);
      font-size: 16px; letter-spacing: 0.12em; text-align: center; outline: none;
      transition: border-color 0.2s, background 0.2s;
      -webkit-appearance: none; appearance: none;
    }
    #gate input::placeholder { color: rgba(255,255,255,0.35); font-size: 12px; text-transform: uppercase; letter-spacing: 0.15em; }
    #gate input:focus { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.1); }
    #gate button {
      padding: 14px; background: #fff; color: #0a0a0a; border-radius: 4px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
      transition: background 0.2s;
    }
    #gate button:hover { background: #e0e0e0; }
    #gate button:active { background: #c8c8c8; }
    #gate-error { min-height: 14px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--pepper); text-align: center; }
    #gate form.shake { animation: shake 0.35s; }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

    /* ───────── Mobile ───────── */
    @media (max-width: 760px) {
      #logo { display: none; }
      .banner { height: 58px; grid-template-columns: 52px 1fr 52px; }
      #rail {
        left: 50%; top: auto; bottom: calc(92px + var(--safe-bottom));
        transform: translateX(-50%); flex-direction: row; width: min(420px, 92vw);
      }
      .slot { flex: 1; padding: 9px 12px; }
      .slot.active { transform: translateY(-4px); }
      #info { left: 20px; width: 150px; bottom: calc(22px + var(--safe-bottom)); }
      #actions { right: 20px; bottom: calc(14px + var(--safe-bottom)); gap: 2px; }
      #hint { display: none; }
    }
  </style>
</head>
<body>

  <div id="backdrop">
    <div class="panel left"></div>
    <div class="panel right"></div>
  </div>
  <div id="ghost"></div>
  <div id="canvas-container"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="logo"><img src="../ColdPepperLogo_blk_01.png" alt="ColdPepper" /></div>

    <div id="top">
      <div class="title-bar">Select Your Fit</div>
      <div class="banner" id="banner">
        <button class="arrow" id="prev" aria-label="Previous item">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 4 6 12l9.5 8z"/></svg>
        </button>
        <div class="center">
          <span class="cat-label" id="cat-label"></span>
          <span id="item-name"></span>
        </div>
        <button class="arrow" id="next" aria-label="Next item">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 4 18 12l-9.5 8z"/></svg>
        </button>
      </div>
    </div>

    <div id="rail"></div>

    <div id="info">
      <div class="row"><span id="info-cat"></span><b id="info-count"></b></div>
      <div id="segments"></div>
    </div>

    <div id="actions">
      <button id="shuffle"><span class="dot"></span>Shuffle</button>
      <button id="spin"><span class="dot"></span><span id="spin-label">Spin: On</span></button>
      <button id="reset"><span class="dot"></span>Reset</button>
    </div>

    <div id="hint">← → change item &nbsp;·&nbsp; ↑ ↓ change piece &nbsp;·&nbsp; drag to rotate</div>
  </div>

  <div id="loading"><span>Loading</span><div class="bar"><i id="loading-bar"></i></div></div>

  <!-- Password gate -->
  <div id="gate">
    <img src="../ColdPepperLogo_blk_01.png" alt="ColdPepper" />
    <form id="gate-form" autocomplete="off">
      <input id="gate-input" type="password" placeholder="Password" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" autofocus />
      <button type="submit">Enter</button>
      <div id="gate-error" role="alert"></div>
    </form>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ════════════════════════════════════════════════════════════════
       CONFIG — edit this to add pieces.
       ────────────────────────────────────────────────────────────────
       Every piece is dressed onto the same invisible, rigged character.
       Add a piece by pushing an entry into the right list below:
         { name: 'Flannel 03', file: 'Flannel_3d_glb_Solid_03.glb' }

       Files load from the site root (next to the main index.html).
       Pieces are auto-fitted and auto-rigged, so they should be modelled
       like the existing ones:
         tops    → button-up / tee in an A-pose, front facing +Z, Y up
         shorts  → standing shorts, front facing +Z, Y up
       Optional per-item tweaks:
         scale:  1.05          → size multiplier
         offset: [x, y, z]     → nudge position (metres)
       ════════════════════════════════════════════════════════════════ */
    const CATEGORIES = [
      {
        id: 'tops', label: 'Tops', kind: 'top', optional: true,
        items: [
          { name: 'Flannel 01', file: 'Flannel_3d_glb_Solid_01.glb' },
          { name: 'Flannel 02', file: 'Flannel_3d_glb_Solid_02.glb' },
        ],
      },
      {
        id: 'shorts', label: 'Shorts', kind: 'bottom', optional: false,
        items: [
          { name: 'Shorts 01', file: 'ColdPepper_Shorts_01.glb' },
          { name: 'Shorts 02', file: 'ColdPepper_Shorts_02.glb' },
        ],
      },
    ];

    /* ── Password gate ──
       Stores a SHA-256 hash, not the plain password. This is a casual
       front-door gate only: the site is static, so anyone who knows the
       file URLs can still fetch them directly. */
    const PW_HASH = '29b23a85b39eb5867e69f9c18a7640ca0634a237d1a1a4c946f56c2aa7f8416f';
    const SESSION_KEY = 'cpc_test_unlocked';

    async function sha256Hex(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }

    const gateForm = document.getElementById('gate-form');
    const gateInput = document.getElementById('gate-input');
    const gateError = document.getElementById('gate-error');
    let appStarted = false;

    function unlock() {
      document.body.classList.add('unlocked');
      try { sessionStorage.setItem(SESSION_KEY, '1'); } catch (e) {}
      if (!appStarted) { appStarted = true; startApp(); }
    }

    gateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!(window.crypto && crypto.subtle)) {
        gateError.textContent = 'Open this page over https';
        return;
      }
      const hash = await sha256Hex(gateInput.value.trim());
      if (hash === PW_HASH) {
        gateError.textContent = '';
        unlock();
      } else {
        gateError.textContent = 'Wrong password';
        gateInput.value = '';
        gateForm.classList.remove('shake'); void gateForm.offsetWidth; gateForm.classList.add('shake');
      }
    });

    try { if (sessionStorage.getItem(SESSION_KEY) === '1') unlock(); } catch (e) {}

    /* ════════════════════════════════════════════════════════════════
       APP — only starts after the gate is cleared
       ════════════════════════════════════════════════════════════════ */
    async function startApp() {
      const ASSET_BASE = new URL('../', document.baseURI);   // site root
      const assetUrl = (f) => new URL(f, ASSET_BASE).href;
      const TAU = Math.PI * 2;

      /* ── Scene ── */
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
      const TARGET = new THREE.Vector3(0, -0.05, 0);
      camera.position.set(0, 0.4, 4.4);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 1.2));
      const key = new THREE.DirectionalLight(0xffffff, 2.5); key.position.set(3, 5, 3); scene.add(key);
      const fill = new THREE.DirectionalLight(0xffffff, 0.8); fill.position.set(-3, 2, -2); scene.add(fill);
      const rim = new THREE.DirectionalLight(0x8fdcff, 1.6); rim.position.set(0, 2, -4); scene.add(rim);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.copy(TARGET);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.enablePan = false;
      controls.enableZoom = false;
      controls.minPolarAngle = Math.PI * 0.36;
      controls.maxPolarAngle = Math.PI * 0.58;
      controls.update();

      /* Platform */
      const platform = new THREE.Group();
      const disc = new THREE.Mesh(
        new THREE.CylinderGeometry(1.1, 1.18, 0.1, 72),
        new THREE.MeshStandardMaterial({ color: 0x14181b, metalness: 0.85, roughness: 0.38 })
      );
      platform.add(disc);
      const ringMat = new THREE.MeshStandardMaterial({ color: 0x8fdcff, emissive: 0x8fdcff, emissiveIntensity: 0.9 });
      const ring = new THREE.Mesh(new THREE.TorusGeometry(1.04, 0.014, 16, 160), ringMat);
      ring.rotation.x = Math.PI / 2; ring.position.y = 0.055;
      platform.add(ring);
      const ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.7, 0.008, 12, 128),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2 }));
      ring2.rotation.x = Math.PI / 2; ring2.position.y = 0.055;
      platform.add(ring2);

      const gc = document.createElement('canvas'); gc.width = gc.height = 256;
      const g2d = gc.getContext('2d');
      const grad = g2d.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0, 'rgba(143,220,255,0.28)'); grad.addColorStop(1, 'rgba(143,220,255,0)');
      g2d.fillStyle = grad; g2d.fillRect(0, 0, 256, 256);
      const glow = new THREE.Mesh(
        new THREE.PlaneGeometry(2.6, 2.6),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(gc), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })
      );
      glow.rotation.x = -Math.PI / 2; glow.position.y = 0.06;
      platform.add(glow);
      platform.position.y = -1.1;
      scene.add(platform);

      function fitCamera() {
        const aspect = window.innerWidth / window.innerHeight;
        const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
        const dist = Math.max(4.4, 1.12 / (tanHalf * aspect));
        const dir = camera.position.clone().sub(controls.target).normalize();
        camera.position.copy(controls.target).addScaledVector(dir, dist);
        controls.update();
      }

      /* ════════════════════════════════════════════════════════════
         THE INVISIBLE CHARACTER
         A 12-bone skeleton (metres, Y up, +Z facing the camera) that is
         never drawn. Every garment is auto-skinned to it, so sleeves
         follow the arms and shorts follow the hips and legs.
         ════════════════════════════════════════════════════════════ */
      const rig = new THREE.Group();
      scene.add(rig);

      const V = (x, y, z) => new THREE.Vector3(x, y, z);
      const mirror = (v) => V(-v.x, v.y, v.z);

      // Joint positions in the rest (A-)pose. Arm joints are measured off the flannels' sleeves.
      const J = {
        root: V(0, 0.97, 0), spine: V(0, 1.10, -0.005), chest: V(0, 1.29, -0.02),
        neck: V(0, 1.56, -0.035), head: V(0, 1.70, -0.035),
        shoulder: V(0.236, 1.435, -0.040), elbow: V(0.401, 1.263, -0.037), wrist: V(0.565, 1.092, -0.012),
        hip: V(0.105, 0.95, 0), knee: V(0.11, 0.52, 0), ankle: V(0.11, 0.08, 0),
      };

      const BONE_NAMES = ['root', 'spine', 'chest', 'neck', 'uaL', 'faL', 'uaR', 'faR', 'thL', 'shL', 'thR', 'shR'];
      const B = {};
      const makeBone = (name, joint, parentJoint) => {
        const b = new THREE.Bone(); b.name = name;
        b.position.copy(joint).sub(parentJoint);
        B[name] = b; return b;
      };
      const ORIGIN = V(0, 0, 0);
      makeBone('root', J.root, ORIGIN);
      makeBone('spine', J.spine, J.root);   B.root.add(B.spine);
      makeBone('chest', J.chest, J.spine);  B.spine.add(B.chest);
      makeBone('neck', J.neck, J.chest);    B.chest.add(B.neck);
      for (const side of ['L', 'R']) {
        const m = side === 'L' ? (v) => v : mirror;
        makeBone('ua' + side, m(J.shoulder), J.chest);       B.chest.add(B['ua' + side]);
        makeBone('fa' + side, m(J.elbow), m(J.shoulder));    B['ua' + side].add(B['fa' + side]);
        makeBone('th' + side, m(J.hip), J.root);             B.root.add(B['th' + side]);
        makeBone('sh' + side, m(J.knee), m(J.hip));          B['th' + side].add(B['sh' + side]);
      }
      rig.add(B.root);
      const bones = BONE_NAMES.map((n) => B[n]);
      rig.updateMatrixWorld(true);
      const skeleton = new THREE.Skeleton(bones);          // rest pose captured here

      // Capsule centre-lines used to compute skin weights
      const seg = (a, b) => ({
        ax: a.x, ay: a.y, az: a.z, dx: b.x - a.x, dy: b.y - a.y, dz: b.z - a.z,
        inv: 1 / Math.max(1e-9, (b.x - a.x) ** 2 + (b.y - a.y) ** 2 + (b.z - a.z) ** 2),
      });
      const SEGS = {
        root: seg(V(0, 0.90, 0), V(0, 1.07, -0.005)),
        spine: seg(V(0, 1.07, -0.005), J.chest),
        chest: seg(J.chest, J.neck),
        neck: seg(J.neck, J.head),
        uaL: seg(J.shoulder, J.elbow), faL: seg(J.elbow, J.wrist),
        uaR: seg(mirror(J.shoulder), mirror(J.elbow)), faR: seg(mirror(J.elbow), mirror(J.wrist)),
        thL: seg(J.hip, J.knee), shL: seg(J.knee, J.ankle),
        thR: seg(mirror(J.hip), mirror(J.knee)), shR: seg(mirror(J.knee), mirror(J.ankle)),
      };
      const SEG_LIST = BONE_NAMES.map((n) => SEGS[n]);
      const idxOf = (names) => names.map((n) => BONE_NAMES.indexOf(n));
      const ALLOWED = {
        top: idxOf(['root', 'spine', 'chest', 'neck', 'uaL', 'faL', 'uaR', 'faR']),
        bottom: idxOf(['root', 'spine', 'thL', 'shL', 'thR', 'shR']),
      };

      // Where each kind of garment sits on the body, and how big it is (metres per model unit)
      const FIT = {
        top:    { scale: 0.041, anchor: 'min', y: 0.90 },   // hem sits at this height
        bottom: { scale: 0.095, anchor: 'max', y: 0.94 },   // top of waistband sits at this height
      };

      /* Auto-skin: weight every vertex to its nearest bones (inverse-distance, up to 4) */
      function skinGeometry(geom, allowed) {
        const pos = geom.attributes.position;
        const n = pos.count, m = allowed.length;
        const skinIndex = new Uint16Array(n * 4);
        const skinWeight = new Float32Array(n * 4);
        const w = new Float32Array(m);
        for (let i = 0; i < n; i++) {
          const px = pos.getX(i), py = pos.getY(i), pz = pos.getZ(i);
          for (let k = 0; k < m; k++) {
            const s = SEG_LIST[allowed[k]];
            let t = ((px - s.ax) * s.dx + (py - s.ay) * s.dy + (pz - s.az) * s.dz) * s.inv;
            t = t < 0 ? 0 : t > 1 ? 1 : t;
            const ex = px - (s.ax + s.dx * t), ey = py - (s.ay + s.dy * t), ez = pz - (s.az + s.dz * t);
            const d = Math.sqrt(ex * ex + ey * ey + ez * ez) + 0.02;
            w[k] = 1 / (d * d * d);
          }
          let sum = 0;
          for (let j = 0; j < 4; j++) {
            let best = -1, bv = 0;
            for (let k = 0; k < m; k++) if (w[k] > bv) { bv = w[k]; best = k; }
            if (best < 0) break;
            skinIndex[i * 4 + j] = allowed[best]; skinWeight[i * 4 + j] = bv; sum += bv; w[best] = 0;
          }
          for (let j = 0; j < 4; j++) skinWeight[i * 4 + j] /= sum;
        }
        geom.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndex, 4));
        geom.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeight, 4));
      }

      /* Flat decal planes (patches) get draped onto the shirt surface so they never float or sink */
      function conformDecals(parts, main, zc) {
        const CELL = 0.5, R2 = 0.25;
        const mp = main.geom.attributes.position;
        const cells = new Map();
        const keyOf = (cx, cy) => (cx + 4096) * 16384 + (cy + 4096);
        for (let i = 0; i < mp.count; i++) {
          const k = keyOf(Math.floor(mp.getX(i) / CELL), Math.floor(mp.getY(i) / CELL));
          let a = cells.get(k); if (!a) cells.set(k, a = []); a.push(i);
        }
        for (const part of parts) {
          if (part === main) continue;
          part.geom.computeBoundingBox();
          const bb = part.geom.boundingBox;
          if (bb.max.z - bb.min.z > 0.05) continue;           // already draped over the surface
          const p = part.geom.attributes.position;
          for (let i = 0; i < p.count; i++) {
            const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
            const front = z > zc;
            const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);
            const zs = [];
            for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
              const a = cells.get(keyOf(cx + dx, cy + dy)); if (!a) continue;
              for (const j of a) {
                const ex = mp.getX(j) - x, ey = mp.getY(j) - y;
                if (ex * ex + ey * ey <= R2) zs.push(mp.getZ(j));
              }
            }
            if (zs.length < 4) continue;
            zs.sort((a, b) => (front ? b - a : a - b));
            const k = Math.min(4, zs.length);
            let s = 0; for (let q = 0; q < k; q++) s += zs[q];
            p.setZ(i, s / k + (front ? 0.04 : -0.04));
          }
          p.needsUpdate = true;
        }
      }

      /* Turn a loaded GLB into rigged, skinned meshes on the shared skeleton */
      function buildGarment(gltf, cat, item) {
        const kind = cat.kind;
        gltf.scene.updateMatrixWorld(true);
        const parts = [];
        gltf.scene.traverse((o) => {
          if (!o.isMesh) return;
          const geom = o.geometry.clone();
          geom.applyMatrix4(o.matrixWorld);                    // bake node transforms
          parts.push({ geom, material: o.material });
        });
        const main = parts.reduce((a, b) => (b.geom.attributes.position.count > a.geom.attributes.position.count ? b : a));
        main.geom.computeBoundingBox();
        const bb = main.geom.boundingBox;
        const H = bb.max.y - bb.min.y, Wd = bb.max.x - bb.min.x;
        const xc = (bb.min.x + bb.max.x) / 2;

        // z-centre of the torso / hip band, so the garment is centred on the spine
        const mp = main.geom.attributes.position;
        const y0 = bb.min.y + (kind === 'top' ? 0.15 : 0.45) * H, y1 = bb.min.y + (kind === 'top' ? 0.35 : 0.70) * H;
        const xLim = kind === 'top' ? 0.14 * Wd : Infinity;
        let zmin = Infinity, zmax = -Infinity;
        for (let i = 0; i < mp.count; i++) {
          const y = mp.getY(i); if (y < y0 || y > y1 || Math.abs(mp.getX(i) - xc) > xLim) continue;
          const z = mp.getZ(i); if (z < zmin) zmin = z; if (z > zmax) zmax = z;
        }
        const zc = isFinite(zmin) ? (zmin + zmax) / 2 : (bb.min.z + bb.max.z) / 2;

        if (kind === 'top') conformDecals(parts, main, zc);

        const f = FIT[kind];
        const s = f.scale * (item.scale ?? 1);
        const off = item.offset ?? [0, 0, 0];
        const ty = f.y - (f.anchor === 'min' ? bb.min.y : bb.max.y) * s;
        const fit = new THREE.Matrix4().makeScale(s, s, s).setPosition(-xc * s + off[0], ty + off[1], -zc * s + off[2]);

        const group = new THREE.Group();
        const materials = new Set();
        const meshes = [];
        let minY = Infinity, maxY = -Infinity, halfX = 0;
        for (const part of parts) {
          part.geom.applyMatrix4(fit);
          part.geom.computeBoundingBox();
          const b = part.geom.boundingBox;
          minY = Math.min(minY, b.min.y); maxY = Math.max(maxY, b.max.y);
          halfX = Math.max(halfX, Math.abs(b.min.x), Math.abs(b.max.x));
          skinGeometry(part.geom, ALLOWED[kind]);

          const m = part.material;
          m.transparent = true;                                // lets the whole piece fade in
          m.side = THREE.DoubleSide;
          const isDecal = part !== main;
          if (isDecal) { m.polygonOffset = true; m.polygonOffsetFactor = -2; m.polygonOffsetUnits = -2; }
          materials.add(m);

          const sm = new THREE.SkinnedMesh(part.geom, m);
          sm.frustumCulled = false;
          sm.renderOrder = isDecal ? 1 : 0;
          sm.bind(skeleton, new THREE.Matrix4());
          group.add(sm); meshes.push(sm);
        }
        group.visible = false;
        rig.add(group);
        return { kind, group, meshes, materials, fade: 1, bounds: { minY, maxY, halfX: halfX * (kind === 'top' ? 0.9 : 1) } };
      }

      /* ── State ── */
      const sel = {};            // categoryId → selected index (-1 = none)
      let activeId = null;
      const usable = () => CATEGORIES.filter(c => c.items.length);
      const minIdx = (c) => (c.optional ? -1 : 0);

      function resetSelection() {
        for (const c of CATEGORIES) sel[c.id] = c.items.length ? 0 : -1;
        activeId = (usable().find(c => sel[c.id] >= 0) || usable()[0] || CATEGORIES[0]).id;
      }
      resetSelection();

      const garmentFor = new Map();   // file → garment
      const shown = {};               // categoryId → garment currently on the character
      let flash = 0;

      /* Framing: scale + lift the character so whatever is showing fills the stage */
      const frame = { S: 1, y: 0, plat: -1.1 };
      const frameT = { S: 1, y: 0, plat: -1.1 };
      const H_T = 1.9, W_T = 1.9, Y_CENTER = 0.02, S_MAX = 3.3;
      function updateFrameTargets() {
        let minY = Infinity, maxY = -Infinity, halfX = 0;
        for (const id in shown) {
          const b = shown[id].bounds;
          minY = Math.min(minY, b.minY); maxY = Math.max(maxY, b.maxY); halfX = Math.max(halfX, b.halfX);
        }
        if (minY === Infinity) return;
        const h = maxY - minY, w = halfX * 2;
        const S = Math.min(H_T / h, W_T / w, S_MAX);
        frameT.S = S;
        frameT.y = Y_CENTER - S * (minY + maxY) / 2;
        frameT.plat = Y_CENTER - (S * h) / 2 - 0.24;
      }

      const setOpacity = (g, v) => { for (const m of g.materials) m.opacity = v; };

      function syncCategory(cat, { pulse = true, instant = false } = {}) {
        const prev = shown[cat.id];
        if (prev) { prev.group.visible = false; delete shown[cat.id]; }
        const idx = sel[cat.id];
        if (idx >= 0) {
          const g = garmentFor.get(cat.items[idx].file);
          if (g) {
            g.group.visible = true;
            g.fade = instant ? 1 : 0;
            setOpacity(g, g.fade);
            shown[cat.id] = g;
          }
        }
        updateFrameTargets();
        if (pulse) flash = 3;
      }

      /* ── UI ── */
      const $ = (id) => document.getElementById(id);
      const nameEl = $('item-name'), catEl = $('cat-label'), ghostEl = $('ghost');
      const railEl = $('rail'), bannerEl = $('banner');

      function itemName(cat) {
        const i = sel[cat.id];
        return i >= 0 ? cat.items[i].name : (cat.items.length ? 'None' : 'Coming Soon');
      }

      function buildRail() {
        railEl.innerHTML = '';
        for (const c of CATEGORIES) {
          const b = document.createElement('button');
          b.className = 'slot interactive'; b.dataset.id = c.id;
          b.innerHTML = '<span class="s-cat"></span><span class="s-name"></span>';
          b.addEventListener('click', () => { if (c.items.length) { activeId = c.id; renderUI(false); } });
          railEl.appendChild(b);
        }
      }

      function renderUI(animateName = true) {
        const cat = CATEGORIES.find(c => c.id === activeId);
        catEl.textContent = cat.label;
        nameEl.textContent = itemName(cat);
        ghostEl.textContent = sel[cat.id] >= 0 ? itemName(cat) : cat.label;
        bannerEl.classList.toggle('disabled', !cat.items.length);
        if (animateName) { nameEl.classList.remove('pop'); void nameEl.offsetWidth; nameEl.classList.add('pop'); }

        for (const b of railEl.children) {
          const c = CATEGORIES.find(x => x.id === b.dataset.id);
          b.classList.toggle('active', c.id === activeId);
          b.classList.toggle('empty', !c.items.length);
          b.querySelector('.s-cat').textContent = c.label;
          b.querySelector('.s-name').textContent = itemName(c);
        }

        const lo = minIdx(cat), total = cat.items.length + (cat.optional ? 1 : 0);
        $('info-cat').textContent = cat.label;
        $('info-count').textContent = cat.items.length
          ? String(sel[cat.id] - lo + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0')
          : '— / —';
        const seg = $('segments'); seg.innerHTML = '';
        for (let i = 0; i < total; i++) {
          const el = document.createElement('i');
          if (cat.items.length && i === sel[cat.id] - lo) el.className = 'on';
          seg.appendChild(el);
        }
      }

      function step(dir) {
        const cat = CATEGORIES.find(c => c.id === activeId);
        if (!cat.items.length) return;
        const lo = minIdx(cat), hi = cat.items.length - 1;
        let v = sel[cat.id] + dir;
        if (v > hi) v = lo; if (v < lo) v = hi;
        sel[cat.id] = v;
        syncCategory(cat);
        renderUI();
      }

      function stepCategory(dir) {
        const list = usable(); if (list.length < 2) return;
        const i = list.findIndex(c => c.id === activeId);
        activeId = list[(i + dir + list.length) % list.length].id;
        renderUI(false);
      }

      function shuffle() {
        for (const c of usable()) {
          const lo = minIdx(c);
          sel[c.id] = lo + Math.floor(Math.random() * (c.items.length - lo));
          syncCategory(c);
        }
        renderUI();
      }

      function reset() {
        resetSelection();
        for (const c of CATEGORIES) syncCategory(c);
        renderUI();
      }

      let spin = true, dragging = false, lastTouch = -1e9;
      const spinLabel = $('spin-label');
      $('spin').addEventListener('click', () => {
        spin = !spin; spinLabel.textContent = spin ? 'Spin: On' : 'Spin: Off';
      });
      controls.addEventListener('start', () => { dragging = true; });
      controls.addEventListener('end', () => { dragging = false; lastTouch = performance.now(); });

      $('prev').addEventListener('click', () => step(-1));
      $('next').addEventListener('click', () => step(1));
      $('shuffle').addEventListener('click', shuffle);
      $('reset').addEventListener('click', reset);
      window.addEventListener('keydown', (e) => {
        if (!document.body.classList.contains('ready')) return;
        if (e.key === 'ArrowLeft') step(-1);
        else if (e.key === 'ArrowRight') step(1);
        else if (e.key === 'ArrowUp') stepCategory(-1);
        else if (e.key === 'ArrowDown') stepCategory(1);
        else return;
        e.preventDefault();
      });

      /* ── Preload models ── */
      const loader = new GLTFLoader();
      const entries = CATEGORIES.flatMap(c => c.items.map(i => ({ cat: c, item: i })));
      const files = [...new Set(entries.map(e => e.item.file))];
      const progress = new Map();
      const bar = $('loading-bar');
      const updateBar = () => {
        const sum = [...progress.values()].reduce((a, b) => a + b, 0);
        bar.style.width = (files.length ? (sum / files.length) * 90 : 90) + '%';
      };

      buildRail();
      renderUI(false);

      const gltfs = new Map();
      await Promise.all(files.map((f) => new Promise((resolve) => {
        progress.set(f, 0);
        loader.load(
          assetUrl(f),
          (gltf) => { gltfs.set(f, gltf); progress.set(f, 1); updateBar(); resolve(); },
          (xhr) => { if (xhr.lengthComputable) { progress.set(f, xhr.loaded / xhr.total); updateBar(); } },
          (err) => { console.error('Failed to load', f, err); progress.set(f, 1); updateBar(); resolve(); }
        );
      })));

      // Rig every garment (yield between pieces so the loading bar keeps moving)
      for (const { cat, item } of entries) {
        if (garmentFor.has(item.file)) continue;
        const gltf = gltfs.get(item.file);
        if (!gltf) continue;
        await new Promise(r => setTimeout(r, 16));
        try { garmentFor.set(item.file, buildGarment(gltf, cat, item)); }
        catch (err) { console.error('Failed to rig', item.file, err); }
        bar.style.width = (90 + 10 * garmentFor.size / files.length) + '%';
      }

      // Pre-warm shaders + textures so the first swap doesn't hitch
      for (const g of garmentFor.values()) {
        g.group.visible = true;
        for (const m of g.materials) for (const k of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap']) if (m[k]) renderer.initTexture(m[k]);
      }
      renderer.compile(scene, camera);
      for (const g of garmentFor.values()) g.group.visible = false;

      for (const c of CATEGORIES) syncCategory(c, { pulse: false, instant: true });
      Object.assign(frame, frameT);
      fitCamera();
      document.body.classList.add('ready');

      /* ── Resize ── */
      function onResize() {
        const w = window.innerWidth, h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        fitCamera();
      }
      window.addEventListener('resize', onResize);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

      /* ════════════════════════════════════════════════════════════
         CASUAL STANDING SWAY
         Layered, slow, non-repeating motion: weight shifts from foot to
         foot (hips tilt one way, shoulders counter-tilt), the torso
         twists a touch, the chest breathes, the unloaded knee relaxes,
         and the arms hang and lag behind the body like real arms do.
         ════════════════════════════════════════════════════════════ */
      const sway  = (t) => 0.70 * Math.sin(TAU * t / 3.8) + 0.30 * Math.sin(TAU * t / 9.1 + 1.3);
      const twist = (t) => 0.65 * Math.sin(TAU * t / 5.3 + 0.6) + 0.35 * Math.sin(TAU * t / 11.7 + 2.0);
      const ARM_DROP = 0.30;     // how far the A-pose arms are relaxed in towards the body (radians)

      function pose(t) {
        const s = sway(t), w = twist(t);
        const br = Math.sin(TAU * t / 4.3);
        const nd = Math.sin(TAU * t / 6.1 + 0.9);
        const sL = sway(t - 0.30), wL = twist(t - 0.25);    // arms lag the torso

        // Pelvis: shifts and tilts with the weight, slight yaw
        B.root.position.set(J.root.x + s * 0.024, J.root.y - Math.abs(s) * 0.003 + br * 0.0006, J.root.z);
        B.root.rotation.set(0, w * 0.060, s * 0.050);
        // Spine / chest: counter-tilt so shoulders stay roughly level, twist the other way, breathe
        B.spine.rotation.set(br * 0.004, -w * 0.036, -s * 0.042);
        B.chest.rotation.set(-0.012 + br * 0.014, -w * 0.042, -s * 0.036);
        B.chest.scale.set(1 + br * 0.004, 1 + br * 0.006, 1 + br * 0.010);
        B.neck.rotation.set(0.01 + nd * 0.020, -w * 0.030 + nd * 0.015, s * 0.030);

        // Arms: relaxed in from the A-pose, swinging passively
        B.uaL.rotation.set(-0.02 + wL * 0.045, 0, -ARM_DROP + sL * 0.040 + br * 0.005);
        B.uaR.rotation.set(-0.02 - wL * 0.045, 0, ARM_DROP + sL * 0.040 - br * 0.005);
        B.faL.rotation.set(-(0.20 + 0.030 * Math.sin(TAU * t / 4.9 + 0.4)), 0, 0);
        B.faR.rotation.set(-(0.20 + 0.030 * Math.sin(TAU * t / 5.7 + 2.1)), 0, 0);

        // Legs: keep the feet planted under the shifting hips; the unloaded leg relaxes
        const loadL = Math.max(0, s), loadR = Math.max(0, -s);   // loadL>0 → weight on +x leg
        B.thL.rotation.set(-loadR * 0.060, 0, -s * 0.027 + loadR * 0.035);
        B.shL.rotation.set(loadR * 0.120, 0, 0);
        B.thR.rotation.set(-loadL * 0.060, 0, -s * 0.027 - loadL * 0.035);
        B.shR.rotation.set(loadL * 0.120, 0, 0);
      }

      /* ── Animate ── */
      let frozenT = null;
      const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
      let last = performance.now();

      function animate() {
        requestAnimationFrame(animate);
        const now = performance.now();
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;

        pose(frozenT ?? now / 1000);

        if (spin && !dragging && now - lastTouch > 2000) rig.rotation.y += dt * 0.30;

        const k = 1 - Math.pow(0.001, dt);                 // frame-rate independent ease
        frame.S += (frameT.S - frame.S) * k;
        frame.y += (frameT.y - frame.y) * k;
        frame.plat += (frameT.plat - frame.plat) * k;
        rig.scale.setScalar(frame.S);
        rig.position.y = frame.y;
        platform.position.y = frame.plat;

        for (const id in shown) {
          const g = shown[id];
          if (g.fade < 1) { g.fade = Math.min(1, g.fade + dt / 0.32); setOpacity(g, easeOutCubic(g.fade)); }
        }

        flash *= 0.9;
        ringMat.emissiveIntensity = 0.9 + flash;

        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      // Test hook — only exists when the URL ends in #debug
      if (location.hash === '#debug') {
        window.__cp = {
          freeze: (t) => { frozenT = t; },
          yaw: (a) => { spin = false; rig.rotation.y = a; },
          sel: (id, i) => {
            const c = CATEGORIES.find(x => x.id === id); sel[id] = i;
            syncCategory(c, { pulse: false, instant: true }); renderUI(false); Object.assign(frame, frameT);
          },
          frame, B, shown, camera, controls,
        };
      }
    }
  </script>

</body>
</html>
